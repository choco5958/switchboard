[package]
name = "switchboard"
version = "0.0.0"
edition = "2021"
description = "Switchboard on Tauri (docs/tauri-이전.md)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
sys-locale = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
user-idle = "0.6.0"
keepawake = "0.6.1"
notify-rust = "4.18.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
getrandom = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
