name: Bug report
description: Something in Switchboard does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Switchboard version
      description: Settings > Updates shows it.
      placeholder: 0.3.12
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux]
    validations:
      required: true
  - type: input
    id: agents
    attributes:
      label: Agents involved
      placeholder: Claude Code 2.1.309, Codex 0.50
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The related lines from app.log, bridge.log or termhost.log in ~/.claude-ide (%USERPROFILE%\.claude-ide on Windows). Check it for tokens and personal data before pasting.
      render: text
