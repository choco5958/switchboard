# The Tauri app's Windows and Linux release files (docs/tauri-이전.md, step 8), built as the release
# builds them (scripts/pack-tauri.ts names them as the Electron release did), then installed and
# run hidden on sample data (scripts/tauri-smoke.ts: the bridge, the session list, a terminal, the
# in-app browser). On Windows it first updates an installed Electron app to this build, the way
# that app's updater will. Run by hand, when the Tauri shell changes, and by the release workflow
# for a tag, whose Windows and Linux files it makes. It runs the dependencies' code, so it can
# write nothing and sees no key.
name: Tauri app (Windows, Linux)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact:
        description: Prefix of the artifacts with the release files (<prefix>-win, <prefix>-linux-x64, ...)
        type: string
        default: tauri
  push:
    branches: [main]
    paths:
      - src-tauri/**
      - src/host/**
      - src/main/*Update*
      - src/main/updat*
      - scripts/*tauri*
      - .github/workflows/tauri-check.yml

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: tauri-win-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Each architecture gets its own Node (nodejs.org, checked against its SHA-256) and node-pty.
      - name: Build the installers
        shell: bash
        run: |
          for pair in x86_64-pc-windows-msvc:x64 aarch64-pc-windows-msvc:arm64; do
            node scripts/fetch-node.ts "${pair%%:*}"
            node scripts/stage-tauri.ts win32 "${pair##*:}"
            pnpm tauri build --target "${pair%%:*}" --bundles nsis
          done
      - run: node scripts/pack-tauri.ts win32 dist
      # What an installed Electron app does when this version comes: electron-updater runs the
      # new installer with --updated /S (src-tauri/windows/hooks.nsh), and --force-run to start it.
      - name: Update the Electron app to this one
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Start-Process -Wait waits for every process the installer started too, and the updated
          # app keeps running: wait for the installer alone.
          function Install($file, $arguments) {
            $run = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            $null = $run.Handle  # keeps the exit code readable after the process ends
            if (-not $run.WaitForExit(300000)) { throw "$file did not finish in 5 minutes" }
            if ($run.ExitCode -ne 0) { throw "$file ended with $($run.ExitCode)" }
          }
          gh release download v0.3.17 -R $env:GITHUB_REPOSITORY -p 'Switchboard-0.3.17-win-x64.exe' -D electron
          Install (Resolve-Path electron\Switchboard-0.3.17-win-x64.exe).Path @('/S', '/currentuser')
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ea94edae-7cd8-5e0c-9fa2-3791d8ac7a6b'
          if (-not (Test-Path $key)) { throw 'the Electron app did not install' }
          $electron = Split-Path ((Get-ItemProperty $key).QuietUninstallString -replace '^"([^"]+)".*$', '$1')
          Write-Output "Electron app in $electron"
          $setup = Get-ChildItem dist\Switchboard-*-win-x64.exe | Select-Object -First 1
          $setup | Format-List Name, Length
          Install $setup.FullName @('--updated', '/S', '--force-run')
          if (Test-Path $key) { throw 'the Electron app is still registered' }
          if (Test-Path (Join-Path $electron 'Switchboard.exe')) { throw "the Electron app is still in $electron" }
          $app = Join-Path $env:LOCALAPPDATA 'Switchboard\switchboard.exe'
          if (-not (Test-Path $app)) { throw "no app at $app" }
          $link = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Switchboard.lnk'
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($link).TargetPath
          if ($target -ne $app) { throw "the Start menu opens $target" }
          $started = $null
          for ($i = 0; $i -lt 30 -and -not $started; $i++) { Start-Sleep 1; $started = Get-Process switchboard -ErrorAction SilentlyContinue }
          if (-not $started) { throw 'the app did not start after the update' }
          Write-Output "started: $($started.Path)"
          Start-Sleep 5
          Stop-Process -Name switchboard, switchboard-node -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
      - name: Run hidden
        if: success() || failure()
        shell: pwsh
        run: node scripts/tauri-smoke.ts "$env:LOCALAPPDATA\Switchboard\switchboard.exe"
      # The Tauri app's own update: found, downloaded, installed when it quits, started again.
      - name: Update itself
        if: success() || failure()
        shell: pwsh
        run: node scripts/tauri-update-check.ts "$env:LOCALAPPDATA\Switchboard\switchboard.exe" dist --expect-arch x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact || 'tauri' }}-win
          path: |
            dist/latest.yml
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

  # An ARM64 PC: the Electron app's update brings the x64 build there (latest.yml names it first),
  # which runs emulated and then updates itself to the ARM64 build.
  windows-arm:
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact || 'tauri' }}-win
          path: dist
      - name: Install the x64 build
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Switchboard-*-win-x64.exe | Select-Object -First 1
          $run = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru
          $null = $run.Handle
          if (-not $run.WaitForExit(300000) -or $run.ExitCode -ne 0) { throw "the installer ended with $($run.ExitCode)" }
      - name: Run the x64 build hidden
        shell: pwsh
        run: node scripts/tauri-smoke.ts "$env:LOCALAPPDATA\Switchboard\switchboard.exe"
      - name: Update to the ARM64 build
        shell: pwsh
        run: node scripts/tauri-update-check.ts "$env:LOCALAPPDATA\Switchboard\switchboard.exe" dist --expect-arch arm64
      - name: Run the ARM64 build hidden
        shell: pwsh
        run: node scripts/tauri-smoke.ts "$env:LOCALAPPDATA\Switchboard\switchboard.exe"

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu GitHub still runs: what is built there runs on newer systems too.
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            arch: x64
            appimage: x86_64
            # From 0.3.13 the Electron release built x64 on Ubuntu 26.04, whose node-pty needs glibc
            # 2.42: those do not start here. 0.3.12 seals its key the same way.
            electron: 0.3.12
          - os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            arch: arm64
            appimage: arm64
            electron: 0.3.17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # No cache of pnpm's store: node-pty's build there may come from a newer Ubuntu (the Test
      # workflow's), whose glibc this one does not have.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: tauri-${{ matrix.triple }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      # WebKitGTK and what the shell links (idle time: libxss; the secret service: dbus), and a
      # secret service for the key check (gnome-keyring, read with secret-tool).
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxss-dev libdbus-1-dev libssl-dev xvfb gnome-keyring libsecret-tools dbus
      - run: pnpm install --frozen-lockfile --config.side-effects-cache=false
      - run: pnpm build
      - run: node scripts/fetch-node.ts ${{ matrix.triple }}
      - run: node scripts/stage-tauri.ts linux ${{ matrix.arch }}
      - name: node-pty loads on this system
        run: node -e "require('./out/tauri/node/node_modules/node-pty'); console.log('node-pty loads')"
      - run: pnpm tauri build --target ${{ matrix.triple }} --bundles deb,appimage
      - run: node scripts/pack-tauri.ts linux ${{ matrix.arch }} dist
      # The window shows on the virtual display: WebKitGTK snapshots only a window on screen.
      - name: Run the AppImage hidden
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          CLAUDE_IDE_CAPTURE_SHOW: '1'
        run: |
          app=$(ls dist/*.AppImage)
          ls -la dist
          xvfb-run -a node scripts/tauri-smoke.ts "$app"
      - name: Update itself
        run: xvfb-run -a node scripts/tauri-update-check.ts "$(ls dist/*.AppImage)" dist
      # The Electron app of the last release seals its key with the secret service, as on a desktop;
      # the Tauri app has to take that key over.
      - name: Take over the Electron app's key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v${{ matrix.electron }} -R "$GITHUB_REPOSITORY" -p 'Switchboard-${{ matrix.electron }}-linux-${{ matrix.appimage }}.AppImage' -D electron
          chmod +x electron/*.AppImage
          xvfb-run -a dbus-run-session -- sh -c 'printf pw | gnome-keyring-daemon --unlock --components=secrets >/dev/null && node scripts/tauri-key-check.ts "$0" "$1"' electron/*.AppImage "$(ls dist/*.AppImage)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact || 'tauri' }}-linux-${{ matrix.arch }}
          path: |
            dist/latest-linux*.yml
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7
