# Type check and tests on every push and pull request.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The pnpm version is package.json's packageManager.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The mod's harness tests (mod/tests/*.test.ts) run in Claude Code's own test kit, which
      # needs no login. The mod's own full type check is not run here: the engine and tool types
      # it checks against are written by Claude Code beside a loaded mod and are not in the
      # repository. pnpm typecheck covers the mod's modules that need none of them.
      - run: npm install -g @anthropic-ai/claude-code@2.1.314
      - run: claude plugin test mod

  # Windows: the bridge over TCP, its start, the shell command and the MCP server reaching
  # it, and the shell helpers. The rest of the suite talks over Unix sockets.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The pnpm version is package.json's packageManager.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --import ./scripts/test-env.ts --test bridge/endpoint.test.ts bridge/schedule.test.ts
      # agents.test.ts checks launch lines through /bin/sh.
      - run: pnpm exec vitest run src/main/shell.test.ts src/main/runtime.test.ts src/main/winLaunch.test.ts src/shared --exclude src/shared/agents.test.ts

  # The permission relay with the real Copilot CLI (scripts/relay-check.ts): its own model server
  # (BYOK, so no sign-in), the app's launch with the relay hook, a throwaway bridge and the app's
  # answer. On Windows this is the check the relay there waits on.
  # Each agent CLI's hooks with the real CLI (scripts/relay-check.ts), at the version the app was
  # tested with: on Windows the app turns on only the ones that pass here (src/main/agentTerms.ts).
  relay:
    name: relay (${{ matrix.agent }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        agent: [copilot, qwen, crush, opencode, codex, gemini]
        include:
          - { agent: copilot, package: '@github/copilot@1.0.105' }
          - { agent: qwen, package: '@qwen-code/qwen-code@0.26.7' }
          - { agent: crush, package: '@charmland/crush@0.99.0' }
          # OpenCode 2 is not on npm (opencode-ai there is OpenCode 1): its release's build, below.
          - { agent: opencode, package: '' }
          - { agent: codex, package: '@openai/codex@0.166.0' }
          - { agent: gemini, package: '@google/gemini-cli@0.67.0' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-node.ts
      - if: matrix.package != ''
        run: npm install -g ${{ matrix.package }}
      # The archive's SHA-256 is written here, not read from the same release.
      - if: matrix.agent == 'opencode'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ runner.os }}" in
            Linux) asset=opencode-linux-x64.tar.gz; sum=09f44302c10fd036912f59c81fd1aef5df45dd06f649197f9dfc9bbe2a79614e; bin=opencode ;;
            macOS) asset=opencode-darwin-arm64.zip; sum=25ba9908979fa7d764792c82589b4b5768ab1511154e0317d98aa77d216ce767; bin=opencode ;;
            Windows) asset=opencode-windows-x64.zip; sum=2f3bfd6b3527c60c2a882557b20ddc9ba6bdff4b5a8fe61c853da8fcfb3076e8; bin=opencode.exe ;;
          esac
          dir="$RUNNER_TEMP/opencode"
          mkdir -p "$dir" && cd "$dir"
          gh release download v2.2.5 --repo anomalyco/opencode --pattern "$asset"
          node -e 'const h=require("crypto").createHash("sha256").update(require("fs").readFileSync(process.argv[1])).digest("hex");if(h!==process.argv[2]){console.error("sha256 "+h);process.exit(1)}' "$asset" "$sum"
          case "$asset" in *.zip) unzip -q "$asset" ;; *) tar xzf "$asset" ;; esac
          echo "AGENT_COMMAND=$dir/$bin" >> "$GITHUB_ENV"
      # jiti reads the app's TypeScript as it is (imports without extensions); it is not a dependency.
      - run: npx -y jiti@2.6.1 scripts/relay-check.ts ${{ matrix.agent }} ${{ env.AGENT_COMMAND }}
