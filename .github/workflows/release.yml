# A tag v* builds the Tauri app's installers on macOS, Windows and Linux, signs the update files
# and publishes them all as one GitHub release. The installed app updates from it,
# and only to a version whose update files carry the signature (src/main/updateSignature.ts).
name: Release

on:
  push:
    tags: ['v*']

# Read-only unless a job says otherwise: only the job that signs and writes the release may.
permissions:
  contents: read

jobs:
  # Before anything is made: the tag names the version every part says, and the checks pass.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The pnpm version is package.json's packageManager.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: The tag matches package.json, the MCP server and the mod
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./package.json').version")
          mcp=$(sed -n "s/^const VERSION = '\(.*\)'$/\1/p" mcp/server.ts)
          mod=$(node -p "require('./mod/.claude-plugin/plugin.json').version")
          echo "tag $tag, package.json $app, mcp/server.ts $mcp, mod/.claude-plugin/plugin.json $mod"
          if [ "$tag" != "$app" ] || [ "$tag" != "$mcp" ] || [ "$tag" != "$mod" ]; then
            echo "::error::$GITHUB_REF_NAME does not match every version above"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # The Tauri app's release files (docs/tauri-이전.md), built and checked by the workflows that
  # try them by hand: they install and run the app, on Windows coming from the last Electron app
  # and on Linux taking over its key, and update it from these files. They run the dependencies'
  # code, so they write nothing and see no key, and hand their files over as artifacts
  # (dist-mac, dist-win, dist-linux-x64, dist-linux-arm64).
  mac:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/tauri-mac.yml
    with:
      artifact: dist-mac

  windows-linux:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/tauri-check.yml
    with:
      artifact: dist

  # The only job that sees the signing key or may write the release, and it runs no dependency's
  # code: Node alone (scripts/sign-update.ts, node:crypto) and gh. A draft until every file is up,
  # so an app checking for updates meanwhile sees nothing half done, nor an unsigned update file.
  release:
    needs: [mac, windows-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: artifacts
      - name: Sign the update files
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/sign-update.ts artifacts release
      - name: Upload to the draft release and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Switchboard $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
